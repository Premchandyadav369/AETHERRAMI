<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Background: Deep Ivory / Crisp Solid Neobrutalist Square with 3px inner margin -->
  <rect x="0" y="0" width="512" height="512" fill="#000000" />
  <rect x="16" y="16" width="480" height="480" fill="#FFFDF0" stroke="#000000" stroke-width="16" />

  <!-- SE(3) Equivariant Chiral Manifold & Hexagonal Chemical Coordinate Node -->
  <!-- Strict Geometric Vector Construction: Isometric Triad meets Aromatic Core -->
  <g transform="translate(256, 256)">
    
    <!-- Outer Hexagonal Boundary (Aromatic Resonance Ring) -->
    <polygon 
      points="0,-160 138.56,-80 138.56,80 0,160 -138.56,80 -138.56,-80" 
      fill="none 
      stroke="#000000" 
      stroke-width="20" 
      stroke-linejoin="round"
    />

    <!-- Inner Isometric Coordinate Triad (SE(3) Continuous Axes) -->
    <!-- Axis 1: Translation vector (Top vertical) -->
    <line x1="0" y1="0" x2="0" y2="-160" stroke="#000000" stroke-width="18" stroke-linecap="round" />
    <!-- Axis 2: Rotation vector R1 (Bottom Right 120 deg) -->
    <line x1="0" y1="0" x2="138.56" y2="80" stroke="#000000" stroke-width="18" stroke-linecap="round" />
    <!-- Axis 3: Rotation vector R2 (Bottom Left 240 deg) -->
    <line x1="0" y1="0" x2="-138.56" y2="80" stroke="#000000" stroke-width="18" stroke-linecap="round" />

    <!-- Top Left Face Highlight: Bio-Electric Lime (#A6FF00) -->
    <polygon points="0,0 0,-160 -138.56,-80" fill="#A6FF00" opacity="0.95" stroke="#000000" stroke-width="8" stroke-linejoin="round" />

    <!-- Top Right Face Highlight: Golden Canary (#FFE600) -->
    <polygon points="0,0 138.56,-80 0,-160" fill="#FFE600" opacity="0.95" stroke="#000000" stroke-width="8" stroke-linejoin="round" />

    <!-- Bottom Face: Deep Contrast Graphite with Stark Hatching (#000000) -->
    <polygon points="0,0 138.56,80 0,160 -138.56,80" fill="#000000" stroke="#000000" stroke-width="8" stroke-linejoin="round" />

    <!-- Central Chiral Kernel: Discrete Vector Neuron Origin Point -->
    <circle cx="0" cy="0" r="28" fill="#FFFFFF" stroke="#000000" stroke-width="12" />
    <circle cx="0" cy="0" r="10" fill="#00F0FF" />

    <!-- 3 Vertex Anchors (AlphaFold 3 Multimer Coordinates) -->
    <circle cx="0" cy="-160" r="18" fill="#000000" stroke="#FFFDF0" stroke-width="6" />
    <circle cx="138.56" cy="80" r="18" fill="#000000" stroke="#FFFDF0" stroke-width="6" />
    <circle cx="-138.56" cy="80" r="18" fill="#000000" stroke="#FFFDF0" stroke-width="6" />

    <!-- High-Contrast Vector Direction Indicators (Discrete SO(3) Quaternions) -->
    <circle cx="69.28" cy="-120" r="6" fill="#000000" />
    <circle cx="-69.28" cy="-120" r="6" fill="#000000" />
    <circle cx="0" cy="120" r="6" fill="#FFFDF0" />

  </g>
</svg>
