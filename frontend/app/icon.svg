<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0e1a"/>
      <stop offset="50%" stop-color="#050716"/>
      <stop offset="100%" stop-color="#0e1124"/>
    </linearGradient>

    <linearGradient id="cyanAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>

    <linearGradient id="glowRing" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.8"/>
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="100" fill="url(#bgGrad)" stroke="rgba(245,158,11,0.3)" stroke-width="4"/>
  <ellipse cx="256" cy="256" rx="180" ry="60" fill="none" stroke="url(#glowRing)" stroke-width="6" transform="rotate(-30 256 256)" filter="url(#neonGlow)" opacity="0.85"/>
  <ellipse cx="256" cy="256" rx="180" ry="60" fill="none" stroke="url(#glowRing)" stroke-width="6" transform="rotate(30 256 256)" filter="url(#neonGlow)" opacity="0.85"/>
  <ellipse cx="256" cy="256" rx="180" ry="60" fill="none" stroke="#00F0FF" stroke-width="4" transform="rotate(90 256 256)" filter="url(#neonGlow)" opacity="0.9"/>

  <g filter="url(#neonGlow)">
    <path d="M 200,120 Q 256,180 312,256 T 200,392" fill="none" stroke="#00F0FF" stroke-width="12" stroke-linecap="round"/>
    <path d="M 312,120 Q 256,180 200,256 T 312,392" fill="none" stroke="#F59E0B" stroke-width="12" stroke-linecap="round"/>
    <line x1="215" y1="150" x2="297" y2="150" stroke="#F43F5E" stroke-width="6" stroke-linecap="round"/>
    <line x1="230" y1="200" x2="282" y2="200" stroke="#00F0FF" stroke-width="6" stroke-linecap="round"/>
    <line x1="245" y1="256" x2="267" y2="256" stroke="#F59E0B" stroke-width="6" stroke-linecap="round"/>
    <line x1="230" y1="312" x2="282" y2="312" stroke="#00F0FF" stroke-width="6" stroke-linecap="round"/>
    <line x1="215" y1="362" x2="297" y2="362" stroke="#F43F5E" stroke-width="6" stroke-linecap="round"/>
  </g>

  <circle cx="256" cy="256" r="28" fill="url(#cyanAmber)" filter="url(#neonGlow)"/>
</svg>
